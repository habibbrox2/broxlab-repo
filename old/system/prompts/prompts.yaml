# ─────────────────────────────────────────────
# AI MODEL CONFIGURATION
# ─────────────────────────────────────────────

models:
  default: "openrouter/deepseek/deepseek-chat"

  admin_default: "openrouter/anthropic/claude-3.5-haiku"

  reasoning_model: "openrouter/anthropic/claude-3.7-sonnet"

  coding_model: "openrouter/deepseek/deepseek-coder"

  fallback:
    - "openrouter/qwen/qwen-2.5-72b-instruct"
    - "openrouter/google/gemini-flash-1.5"
    - "openrouter/meta-llama/llama-3.1-70b"
    - "meta-llama/llama-3-8b-instruct:free"

# ─────────────────────────────────────────────
# RESPONSE SETTINGS
# ─────────────────────────────────────────────

settings:
  max_tokens: 500
  admin_max_tokens: 2000

  temperature: 0.3
  top_p: 0.9

  presence_penalty: 0.0
  frequency_penalty: 0.0

  stream_response: true
  enable_markdown: true

# ─────────────────────────────────────────────
# CONTEXT SETTINGS
# ─────────────────────────────────────────────

context:
  max_history_messages: 12

  include_knowledge_base: true
  include_recent_content: true
  include_user_profile: false

  relevance_threshold: 0.65

# ─────────────────────────────────────────────
# ADVANCED AI FEATURES
# ─────────────────────────────────────────────

features:
  enable_rag: true
  enable_tool_calling: true
  enable_semantic_cache: true
  enable_cost_tracking: true
  enable_prompt_injection_protection: true

name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p /tmp/ssh
          if echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode >/tmp/ssh/deploy_key 2>/dev/null; then
            echo "Decoded SSH key from base64"
          else
            echo "${{ secrets.SSH_KEY_BASE64 }}" > /tmp/ssh/deploy_key
          fi
          chmod 600 /tmp/ssh/deploy_key
        shell: bash

      - name: Define remote source path
        run: |
          echo "REMOTE_SOURCE=/home/${{ secrets.USER }}/broxlab/build_source/$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
        shell: bash

      - name: Sync changed files to remote
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          REMOTE_BASE="/home/${USER}/broxlab"
          ssh -i /tmp/ssh/deploy_key -o StrictHostKeyChecking=no -p "$SSH_PORT" "$USER@$HOST" "mkdir -p '$REMOTE_BASE/build_source'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='storage/cache' \
            --exclude='storage/logs' \
            --exclude='storage/tmp' \
            --exclude='storage/ocr-temp' \
            --exclude='storage/sessions' \
            ./ "$USER@$HOST:$REMOTE_SOURCE"
        shell: bash

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: /tmp/ssh/deploy_key
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            cd /home/${{ secrets.USER }}/broxlab
            bash web-host/scripts/deploy.sh --source-dir "$REMOTE_SOURCE"

      - name: Post-Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
          fi

name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.SSH_KEY_BASE64 }}" ]; then
            echo 'Error: SSH_KEY_BASE64 secret is required.' >&2
            exit 1
          fi
          echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode > /tmp/broxlab_action
          chmod 600 /tmp/broxlab_action
        shell: bash

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: /tmp/broxlab_action
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            cd /home/tdhuedhn/broxlab
            export USE_HTTPS=true
            bash scripts/deploy.sh

      - name: Post-Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
          fi

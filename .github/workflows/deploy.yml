name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.SSH_KEY_BASE64 }}" ]; then
            echo "SSH_KEY_BASE64 is required." >&2
            exit 1
          fi
          echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
        shell: bash

      - name: Deploy to production server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export REMOTE_BASE="${{ secrets.REMOTE_BASE }}"
          if [ -z "$REMOTE_BASE" ]; then
            REMOTE_BASE="/home/${{ secrets.USER }}/broxlab"
          fi
          export REMOTE_USER="${{ secrets.USER }}"
          export REMOTE_HOST="${{ secrets.HOST }}"
          export REMOTE_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$REMOTE_PORT" ]; then
            REMOTE_PORT=22
          fi
          bash scripts/local_deploy.sh \
            -u "$REMOTE_USER" \
            -h "$REMOTE_HOST" \
            -k ~/.ssh/deploy_key \
            -b "$REMOTE_BASE" \
            -p "$REMOTE_PORT" \
            --no-build
        shell: bash

      - name: Deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
            exit 1
          fi

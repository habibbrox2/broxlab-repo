name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.SSH_KEY_BASE64 }}" ]; then
            echo 'Error: SSH_KEY_BASE64 secret is required.' >&2
            exit 1
          fi
          echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode > /tmp/broxlab_action
          chmod 600 /tmp/broxlab_action
        shell: bash

      - name: Create release archive
        run: |
          RELEASE_TS=$(date +"%Y%m%d_%H%M%S")
          echo "RELEASE_TS=$RELEASE_TS" >> $GITHUB_ENV
          # create a tarball of the repo (exclude git metadata to keep size down)
          tar --exclude='.git' -czf release_${RELEASE_TS}.tar.gz .
        shell: bash

      - name: Upload release archive to server
        run: |
          mkdir -p /tmp
          REMOTE_DIR="/home/${{ secrets.USER }}/broxlab/app/releases/${RELEASE_TS}"
          ssh -i /tmp/broxlab_action -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USER }}@${{ secrets.HOST }} "mkdir -p '${REMOTE_DIR}'"
          scp -i /tmp/broxlab_action -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null release_${RELEASE_TS}.tar.gz ${{ secrets.USER }}@${{ secrets.HOST }}:"${REMOTE_DIR}/"
        shell: bash

      - name: Deploy to server (extract uploaded release + run deploy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: /tmp/broxlab_action
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            set -euo pipefail
            # Use the release timestamp produced earlier by the runner
            RELEASE_TS="${RELEASE_TS:-}"
            if [ -z "$RELEASE_TS" ]; then
              RELEASE_TS=$(date +"%Y%m%d_%H%M%S")
            fi
            REMOTE_DIR="/home/${{ secrets.USER }}/broxlab/app/releases/${RELEASE_TS}"
            cd /home/${{ secrets.USER }}/broxlab || exit 1
            # If archive exists on remote, extract it into the release dir
            if [ -f "${REMOTE_DIR}/release_${RELEASE_TS}.tar.gz" ]; then
              echo "Extracting release_${RELEASE_TS}.tar.gz into ${REMOTE_DIR}..."
              tar -xzf "${REMOTE_DIR}/release_${RELEASE_TS}.tar.gz" -C "${REMOTE_DIR}" || true
              rm -f "${REMOTE_DIR}/release_${RELEASE_TS}.tar.gz" || true
            fi
            # Run the server-side deploy script (it will detect pre-populated release and skip git clone)
            export USE_HTTPS=false
            bash scripts/deploy.sh --base /home/${{ secrets.USER }}/broxlab

      - name: Post-Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
          fi

name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.SSH_KEY_BASE64 }}" ]; then
            echo "SSH_KEY_BASE64 is required." >&2
            exit 1
          fi
          echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
        shell: bash

      - name: Deploy to production server
        run: |
          set -euo pipefail

          export REMOTE_BASE="${{ secrets.REMOTE_BASE }}"
          if [ -z "$REMOTE_BASE" ]; then
            REMOTE_BASE="/home/${{ secrets.USER }}/broxlab"
          fi
          export REMOTE_USER="${{ secrets.USER }}"
          export REMOTE_HOST="${{ secrets.HOST }}"
          export REMOTE_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$REMOTE_PORT" ]; then
            REMOTE_PORT=22
          fi
          export KEEP_RELEASES="${{ secrets.KEEP_RELEASES }}"
          if [ -z "$KEEP_RELEASES" ]; then
            KEEP_RELEASES=3
          fi

          export GIT_REPO="${{ secrets.GIT_REPO }}"
          if [ -z "$GIT_REPO" ]; then
            GIT_REPO="git@github.com:${{ github.repository }}.git"
          fi
          export REF="main"

          SSH_OPTS=( -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$REMOTE_PORT" )

          echo "Creating remote directories"
          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$REMOTE_HOST" "mkdir -p '$REMOTE_BASE/web-host/scripts' '$REMOTE_BASE/app/shared' '$REMOTE_BASE/logs'"

          echo "Copying deploy helper scripts to remote"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $REMOTE_PORT" \
            web-host/scripts/deploy.sh web-host/scripts/rollback.sh web-host/scripts/DEPLOYMENT_GUIDE_BN.md web-host/scripts/DEPLOYMENT_GUIDE.md \
            "$REMOTE_USER@$REMOTE_HOST:$REMOTE_BASE/web-host/scripts/"

          echo "Ensuring remote deploy scripts are executable"
          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$REMOTE_HOST" bash -lc "chmod +x '$REMOTE_BASE/web-host/scripts/deploy.sh' '$REMOTE_BASE/web-host/scripts/rollback.sh'"

          echo "Invoking remote web-host deploy script"
          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$REMOTE_HOST" bash -lc "cd '$REMOTE_BASE' && bash web-host/scripts/deploy.sh --base '$REMOTE_BASE' --repo '$GIT_REPO' --ref '$REF' --keep '$KEEP_RELEASES'"
        shell: bash

      - name: Deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
            exit 1
          fi

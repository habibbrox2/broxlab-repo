name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p /tmp/ssh
          if echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode >/tmp/ssh/deploy_key 2>/dev/null; then
            echo "Decoded SSH key from base64"
          else
            echo "${{ secrets.SSH_KEY_BASE64 }}" > /tmp/ssh/deploy_key
          fi
          chmod 600 /tmp/ssh/deploy_key
        shell: bash

      - name: Build frontend assets
        run: |
          npm ci --include=dev
          npm run build:prod
          npm run build:laravel
          tar -czf broxlab-assets.tar.gz \
            public/assets/ai/dist \
            public/assets/css/dist \
            public/assets/js/dist \
            public/assets/firebase/v2/dist \
            public/assets/laravel/dist \
            public/rtceditor/editor.bundle.js
        shell: bash

      - name: Upload deploy script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: /tmp/ssh/deploy_key
          port: 22
          source: "web-host/scripts/deploy.sh"
          target: "/tmp/broxlab-deploy"

      - name: Upload frontend assets
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: /tmp/ssh/deploy_key
          port: 22
          source: "broxlab-assets.tar.gz"
          target: "/tmp/broxlab-deploy"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: /tmp/ssh/deploy_key
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            cd /home/tdhuedhn/broxlab
            # Refresh the local copy from the pushed commit first: the old
            # scripts/deploy.sh is only refreshed AFTER validation passes,
            # so a broken copy would otherwise block every future deploy.
            cp -f /tmp/broxlab-deploy/web-host/scripts/deploy.sh scripts/deploy.sh
            chmod +x scripts/deploy.sh
            # --migrate is opt-in and targeted: only listed files run.
            # The sidebar-width migration has already succeeded; it stays
            # listed because it is idempotent (hasColumn guard).
            # MCP tables (2026_09_24_*) are idempotent/rerunnable and required
            # by /admin/mcp and the /mcp server (fail-closed without them).
            ASSET_ARCHIVE=/tmp/broxlab-deploy/broxlab-assets.tar.gz \
              bash scripts/deploy.sh --base /home/tdhuedhn/broxlab --repo git@github.com:habibbrox2/broxlab-repo.git --ref main \
              --migrate "database/migrations/2026_09_23_000001_add_admin_sidebar_width_to_users.php database/migrations/2026_09_23_000100_create_hero_alif_commerce_tables.php database/migrations/2026_09_23_000200_create_hero_alif_sales_tables.php database/migrations/2026_09_23_000300_create_hero_alif_customers_tables.php database/migrations/2026_09_23_000400_create_hero_alif_orders_tables.php database/migrations/2026_09_23_000500_create_hero_alif_services_tables.php database/migrations/2026_09_23_000600_create_hero_alif_expenses_table.php database/migrations/2026_09_24_000001_create_mcp_api_keys_table.php database/migrations/2026_09_24_000002_add_mcp_settings_columns.php database/migrations/2026_09_24_000003_create_mcp_logs_table.php"

      - name: Post-Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
          fi

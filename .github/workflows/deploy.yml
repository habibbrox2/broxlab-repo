name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        id: prepare
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SSH_KEY_BASE64 }}" ]; then
            echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode > /tmp/broxlab_action
          elif [ -n "${{ secrets.SSH_KEY }}" ]; then
            printf '%s' "${{ secrets.SSH_KEY }}" > /tmp/broxlab_action
          else
            echo 'Error: SSH_KEY_BASE64 or SSH_KEY secret is required.' >&2
            exit 1
          fi
          chmod 600 /tmp/broxlab_action
          echo 'ssh_key<<EOF' >> $GITHUB_OUTPUT
          cat /tmp/broxlab_action >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
        shell: bash

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ steps.prepare.outputs.ssh_key }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            cd /home/tdhuedhn/broxlab
            export USE_HTTPS=true
            bash scripts/deploy.sh

      - name: Post-Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
          fi

name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.SSH_KEY_BASE64 }}" ]; then
            echo 'Error: SSH_KEY_BASE64 secret is required.' >&2
            exit 1
          fi
          echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 --decode > /tmp/broxlab_action
          chmod 600 /tmp/broxlab_action
        shell: bash

      - name: Deploy to server (run simple_deploy.sh via HTTPS clone)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: /tmp/broxlab_action
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            set -euo pipefail
            # Determine repo and ref. Optionally set secrets.REPO_URL to override default.
            GIT_REPO="${{ secrets.REPO_URL }}"
            if [ -z "$GIT_REPO" ]; then
              GIT_REPO="https://github.com/habibbrox2/broxlab-repo.git"
            fi
            REF="${{ github.ref_name }}"
            if [ -z "$REF" ]; then
              REF="main"
            fi
            # Ensure base dir exists
            REMOTE_BASE="/home/${{ secrets.USER }}/broxlab"
            mkdir -p "$REMOTE_BASE"
            cd "$REMOTE_BASE" || exit 1
            # Run the simple deploy script on the server which will clone via HTTPS
            bash scripts/simple_deploy.sh --repo "$GIT_REPO" --ref "$REF" --base "$REMOTE_BASE"



      - name: Post-Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
          else
            echo "❌ Production deployment failed - check server logs"
          fi
